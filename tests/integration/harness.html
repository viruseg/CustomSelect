<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>harness</title>
    <link rel="stylesheet" href="/src/styles/index.css">
    <style>body{background:#09090b;padding:40px}#host{width:400px}</style>
</head>
<body>
<div id="host"></div>
<script type="module">
    import { CustomSelect } from '/src/index.js';

    const params = new URLSearchParams(location.search);
    const kase = params.get('case') ?? 'basic';

    /** @returns {Array<any>} */
    const baseItems = [
        { id: 'a', type: 'text', content: 'Alpha' },
        { id: 'b', type: 'text', content: 'Beta' },
        { id: 'c', type: 'text', content: 'Gamma', disabled: true },
        { id: 'd', type: 'text', content: 'Delta', group: 'G' },
        { id: 'e', type: 'text', content: 'Epsilon', group: 'G' },
    ];

    /** @type {Record<string, any>} */
    const cases = {
        basic: { items: baseItems },
        single: { items: baseItems, selectedIds: ['a'] },
        multi: { items: baseItems, multiple: true, selectedIds: ['a'], showCheckAll: true, showUncheckAll: true, maxLines: 1 },
        search: { items: baseItems, highlightSearchMatches: true },
        columns: { items: Array.from({ length: 30 }, (_, i) => ({ id: i, type: 'text', content: `Opt ${i}`, group: i < 15 ? 'A' : 'B' })), columns: 3, modalMaxHeight: 180 },
        tallSingle: { items: Array.from({ length: 30 }, (_, i) => ({ id: i, type: 'text', content: `Opt ${i}` })), modalMaxHeight: 180 },
        multiMax2: { items: Array.from({ length: 12 }, (_, i) => ({ id: i, type: 'text', content: `Item ${i}` })), multiple: true, maxLines: 2 },
        singleImage: {
            items: [{
                id: 1,
                type: 'image',
                content: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' rx='8' fill='%236366f1'/></svg>`,
                ariaLabel: 'Palette swatch',
            }],
            selectedIds: [1],
            searchable: false,
        },
        imagesPopover: {
            items: Array.from({ length: 6 }, (_, i) => ({
                id: i,
                type: 'image',
                content: `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><rect width='48' height='48' rx='8' fill='%23${['e11d48','6366f1','059669','d97706','7c3aed','db2777'][i]}'/></svg>`,
                ariaLabel: `Swatch ${i}`,
            })),
            multiple: true,
            searchable: false,
        },
        overflowMulti: {
            items: Array.from({ length: 22 }, (_, i) => ({ id: i, type: 'text', content: `Fruit ${String(i + 1).padStart(2, '0')}` })),
            multiple: true,
            maxLines: 2,
            showCheckAll: true,
        },
        readonly: { items: baseItems, readonly: true },
        loading: { items: baseItems, loading: true },
        disabled: { items: baseItems, disabled: true },
        events: { items: baseItems, multiple: true },
        overflowBottom: { items: baseItems },
        // Регрессия ширины триггера: flex-родитель сжимается по содержимому —
        // дефолтная ширина не должна следовать за текстом пункта/плейсхолдера.
        widthFlex: {
            items: [
                { id: 'short', type: 'text', content: 'Hi' },
                ...baseItems,
                { id: 'long', type: 'text', content: 'Unbelievably long option title for width probing' },
            ],
        },
        // Узкий триггер: пилюля «Beta Gamma Delta» шире контентной области —
        // переполнение только горизонтальное, строки maxLines не превышены.
        narrowMulti: {
            items: [
                { id: 'a', type: 'text', content: 'Alpha' },
                { id: 'b', type: 'text', content: 'Beta Gamma Delta' },
            ],
            multiple: true,
            maxLines: 2,
            selectedIds: ['a', 'b'],
            showCheckAll: true,
            mainWidth: 100,
        },
    };

    if (kase === 'overflowBottom') {
        const spacer = document.createElement('div');
        spacer.style.height = 'calc(100vh - 120px)';
        document.body.prepend(spacer);
    }

    // widthFlex: body → flex-контейнер, #host теряет фикс. ширину и сжимается по содержимому
    if (kase === 'widthFlex') {
        document.body.style.display = 'flex';
        document.getElementById('host').style.width = 'auto';
    }

    window.__select = new CustomSelect(document.getElementById('host'), cases[kase] ?? cases.basic, {
        onSelect: (_instance, item) => window.dispatchEvent(new CustomEvent('csel-select', { detail: item.id })),
        onDeselect: (_instance, item) => window.dispatchEvent(new CustomEvent('csel-deselect', { detail: item.id })),
        onChange: (_instance, items) => window.dispatchEvent(new CustomEvent('csel-change', { detail: items.map((i) => i.id) })),
        onOpen: (_instance) => window.dispatchEvent(new CustomEvent('csel-open')),
        onClose: (_instance) => window.dispatchEvent(new CustomEvent('csel-close')),
        onSearch: (_instance, q, matched) => window.dispatchEvent(new CustomEvent('csel-search', { detail: { q, n: matched.length } })),
        onUncheckAll: (_instance) => window.dispatchEvent(new CustomEvent('csel-uncheckAll')),
    });

    window.__api = window.__select;
</script>
</body>
</html>
